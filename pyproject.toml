[project]
name = "sec-rag"
version = "0.1.0"
description = "Hybrid RAG over SEC filings, with a measured retrieval eval harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "bm25s>=0.2",
    "numpy>=1.26",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
eval = ["scikit-learn>=1.5"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
